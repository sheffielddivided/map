<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NCS Mapmaker</title>
  <!-- Mapmaker har flyttet til et eget repo (sheffielddivided/mapmaker) og ligger
       på map.kbak.no. Denne siden sender videre og tar med oppsettet i lenken
       (#s=…), så gamle lenker og bokmerker fortsatt virker. -->
  <script>location.replace('https://map.kbak.no/' + location.hash);</script>
  <noscript><meta http-equiv="refresh" content="0; url=https://map.kbak.no/" /></noscript>
  <style>
    body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1a2332; margin: 3em auto; max-width: 34em; padding: 0 16px; }
    a { color: #ce0f69; }
  </style>
</head>
<body>
  <p>NCS Mapmaker has moved to <a href="https://map.kbak.no/" id="to">map.kbak.no</a>.</p>
  <script>document.getElementById('to').href = 'https://map.kbak.no/' + location.hash;</script>
</body>
</html>
